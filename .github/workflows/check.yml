name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: go vet ./...
      - run: go test -timeout=10m ./...
